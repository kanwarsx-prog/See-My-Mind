services:
  db:
    image: pgvector/pgvector:pg16
    container_name: seemy_mind_db
    restart: always
    environment:
      POSTGRES_USER: seemymind
      POSTGRES_PASSWORD: seemymind_dev_password
      POSTGRES_DB: seemymind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
